  I'm a postdoctoral researcher in the Environmental Dynamics Laboratory at MIT, where I study ocean turbulence and particle transport. My current work supports understanding the efficacy of marine carbon dioxide removal and the environmental impacts of deep-sea mining. My research spans observational field campaigns using novel instruments, lab studies, and numerical modeling.
  <br><br>
  I am also a passionate decarbonization advocate and enjoy thinking about solutions for the clean energy transition.
  <br><br>
